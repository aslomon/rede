name: Verify published release

# Signing remains on the owner's Mac. This read-only job verifies the public assets after
# the separately approved local publish command makes a complete draft release visible.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-assets:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify anonymously downloaded feed and signed archive
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          args=(verify-remote --repository "$GITHUB_REPOSITORY")
          if [ -n "$EXPECTED_RELEASE_TAG" ]; then
            args+=(--expect-tag "$EXPECTED_RELEASE_TAG")
          fi
          tools/release/release "${args[@]}"
